# GCC cross-compilation file for building on Linux x86_64 targeting Linux aarch64.
#
# Prerequisites:
#   1. Install aarch64 cross-toolchain (e.g. `pacman -S aarch64-linux-gnu-gcc` on Arch)
#   2. Install aarch64 dependencies to a cross-prefix (e.g. via vcpkg arm64-linux triplet):
#        vcpkg install --triplet arm64-linux \
#          cryptopp curl fontconfig freetype libpng libxml2 openssl podofo zlib
#
# Usage:
#   PKG_CONFIG_LIBDIR=/path/to/arm64-linux/lib/pkgconfig \
#     meson setup builddir-aarch64 --cross-file cross-aarch64.ini
#   meson compile -C builddir-aarch64

[binaries]
c = '/usr/bin/aarch64-linux-gnu-gcc'
cpp = '/usr/bin/aarch64-linux-gnu-g++'
ar = '/usr/bin/aarch64-linux-gnu-ar'
strip = '/usr/bin/aarch64-linux-gnu-strip'
pkg-config = '/usr/bin/pkg-config'

[built-in options]
cpp_args = ['-fpermissive']
cpp_link_args = []
c_args = []
c_link_args = []

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
