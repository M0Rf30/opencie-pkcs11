<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B2B44"/>
      <stop offset="1" stop-color="#0A1220"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE38A"/>
      <stop offset="0.6" stop-color="#E0AE3E"/>
      <stop offset="1" stop-color="#B07F22"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Card outline -->
  <rect x="16" y="34" width="96" height="62" rx="9" fill="#13233A" stroke="#5FA8E8" stroke-width="4"/>

  <!-- Chip -->
  <g transform="translate(27 49)">
    <rect width="28" height="22" rx="3.5" fill="url(#chip)"/>
    <g stroke="#8A6116" stroke-width="1.2" fill="none">
      <line x1="0" y1="7.3" x2="28" y2="7.3"/>
      <line x1="0" y1="14.7" x2="28" y2="14.7"/>
      <line x1="14" y1="0" x2="14" y2="22"/>
    </g>
  </g>

  <!-- Key: the card's private key exposed through PKCS#11 -->
  <g stroke="#5FA8E8" stroke-width="4.5" stroke-linecap="round" fill="none">
    <circle cx="75" cy="65" r="9"/>
    <line x1="84" y1="65" x2="101" y2="65"/>
    <line x1="94" y1="65" x2="94" y2="72"/>
    <line x1="100" y1="65" x2="100" y2="70"/>
  </g>
</svg>
