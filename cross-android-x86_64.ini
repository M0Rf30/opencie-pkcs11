# Android NDK cross-compilation file for building targeting Android x86_64.
#
# Prerequisites:
#   1. Install the Android NDK (r26+) — download from https://developer.android.com/ndk
#   2. Set ndk_path below to your NDK installation directory
#   3. Install x86_64-android dependencies via vcpkg:
#        vcpkg install --triplet x64-android cryptopp curl openssl
#
# Usage:
#   PKG_CONFIG_LIBDIR=/path/to/x64-android/lib/pkgconfig \
#     meson setup builddir-android-x86_64 --cross-file cross-android-x86_64.ini
#   meson compile -C builddir-android-x86_64

[constants]
ndk_path = '/opt/android-ndk'
api = '24'
toolchain = ndk_path + '/toolchains/llvm/prebuilt/linux-x86_64/bin'

[binaries]
c = toolchain + '/x86_64-linux-android' + api + '-clang'
cpp = toolchain + '/x86_64-linux-android' + api + '-clang++'
ar = toolchain + '/llvm-ar'
strip = toolchain + '/llvm-strip'
ranlib = toolchain + '/llvm-ranlib'
pkg-config = '/usr/bin/pkg-config'

[built-in options]
cpp_args = ['-fvisibility=hidden']
c_args = ['-fvisibility=hidden']
cpp_link_args = []
c_link_args = []

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'android'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
