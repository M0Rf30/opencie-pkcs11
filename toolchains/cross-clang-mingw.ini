# Clang cross-compilation file for building on Linux targeting Windows.
#
# Uses Clang as the compiler with the MinGW-w64 sysroot. Clang picks up
# MinGW's libstdc++ headers and runtime libraries automatically, so the
# output is ABI-compatible with vcpkg x64-mingw-dynamic packages.
#
# Prerequisites:
#   1. Install Clang (e.g. `pacman -S clang` on Arch, `apt install clang` on Debian)
#   2. Install MinGW-w64 toolchain (for sysroot, linker, and runtime libraries)
#   3. Install vcpkg and set VCPKG_ROOT environment variable
#   4. Install dependencies: vcpkg install --triplet x64-mingw-dynamic \
#        cryptopp curl freetype libpng libxml2 openssl podofo zlib
#
# Usage:
#   export VCPKG_ROOT=$HOME/vcpkg
#   PKG_CONFIG_LIBDIR=$VCPKG_ROOT/installed/x64-mingw-dynamic/lib/pkgconfig \
#     meson setup builddir-clang-win --cross-file toolchains/cross-clang-mingw.ini
#   meson compile -C builddir-clang-win

[binaries]
c = ['clang', '--target=x86_64-w64-mingw32']
cpp = ['clang++', '--target=x86_64-w64-mingw32']
ar = '/usr/bin/x86_64-w64-mingw32-ar'
strip = '/usr/bin/x86_64-w64-mingw32-strip'
windres = '/usr/bin/x86_64-w64-mingw32-windres'
exe_wrapper = 'wine64'
pkg-config = '/usr/bin/pkg-config'
cmake = 'cmake'

[built-in options]
cpp_args = ['-DNOMINMAX', '-fpermissive']
c_args = []

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
