# Clang cross-compilation file for building on Linux x86_64 targeting Linux aarch64.
#
# Uses Clang as the compiler targeting aarch64-linux-gnu. Clang picks up the
# GCC aarch64 sysroot automatically for headers and runtime libraries.
#
# Prerequisites:
#   1. Install Clang (e.g. `pacman -S clang` on Arch)
#   2. Install aarch64 cross-toolchain (for sysroot and runtime libraries)
#   3. Install aarch64 dependencies to a cross-prefix (e.g. via vcpkg arm64-linux triplet):
#        vcpkg install --triplet arm64-linux \
#          curl fontconfig freetype libpng libxml2 openssl podofo zlib
#
# Usage:
#   PKG_CONFIG_LIBDIR=/path/to/arm64-linux/lib/pkgconfig \
#     meson setup builddir-clang-aarch64 --cross-file toolchains/cross-clang-aarch64.ini
#   meson compile -C builddir-clang-aarch64

[binaries]
c = ['clang', '--target=aarch64-linux-gnu']
cpp = ['clang++', '--target=aarch64-linux-gnu']
ar = '/usr/bin/aarch64-linux-gnu-ar'
strip = '/usr/bin/aarch64-linux-gnu-strip'
pkg-config = '/usr/bin/pkg-config'

[built-in options]
cpp_args = ['-fpermissive', '--sysroot=/usr/aarch64-linux-gnu']
cpp_link_args = ['-fuse-ld=lld', '--sysroot=/usr/aarch64-linux-gnu']
c_args = ['--sysroot=/usr/aarch64-linux-gnu']
c_link_args = ['-fuse-ld=lld', '--sysroot=/usr/aarch64-linux-gnu']

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
