# GCC cross-compilation file for building on Linux x86_64 targeting Linux aarch64.
#
# Prerequisites:
#   1. Install aarch64 cross-toolchain (e.g. `pacman -S aarch64-linux-gnu-gcc` on Arch)
#   2. Install aarch64 dependencies to a cross-prefix (e.g. via vcpkg arm64-linux triplet):
#        vcpkg install --triplet arm64-linux \
#          curl fontconfig freetype libpng libxml2 openssl podofo zlib
#
# Usage:
#   # Substitute the absolute path to this checkout for the @SOURCE_ROOT@
#   # placeholder used by `cmake_toolchain_file` (Meson requires an absolute
#   # path here). Re-run only on fresh checkouts.
#   sed -i "s|@SOURCE_ROOT@|$(pwd)|g" toolchains/cross-aarch64.ini
#
#   PKG_CONFIG_LIBDIR=/path/to/arm64-linux/lib/pkgconfig \
#     meson setup builddir-aarch64 --cross-file toolchains/cross-aarch64.ini
#   meson compile -C builddir-aarch64

[binaries]
c = '/usr/bin/aarch64-linux-gnu-gcc'
cpp = '/usr/bin/aarch64-linux-gnu-g++'
ar = '/usr/bin/aarch64-linux-gnu-ar'
strip = '/usr/bin/aarch64-linux-gnu-strip'
pkg-config = '/usr/bin/pkg-config'
cmake = '/usr/bin/cmake'

# -fpermissive was previously set here with no comment explaining why. Every
# first-party source file in the meson.build source lists was syntax-checked
# with this cross g++ (16.1.0) under -std=c++20 without -fpermissive and
# none required it (only failures were missing third-party headers not
# installed in this sysroot, e.g. openssl/curl). Removed.
[built-in options]
cpp_args = []
cpp_link_args = []
c_args = []
c_link_args = []

[properties]
needs_exe_wrapper = true
# Used by Meson when configuring CMake-based subprojects (e.g. the libpodofo
# fallback) so they cross-compile to aarch64. Meson requires this to be an
# absolute path; CI / build scripts substitute @SOURCE_ROOT@ with the
# repository checkout directory before running `meson setup`.
cmake_toolchain_file = '@SOURCE_ROOT@/toolchains/cmake-aarch64-toolchain.cmake'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
