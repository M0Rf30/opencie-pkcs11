# Android NDK cross-compilation file for building targeting Android aarch64.
#
# Prerequisites:
#   1. Install the Android NDK (r26+) — download from https://developer.android.com/ndk
#   2. Set ndk_path below to your NDK installation directory
#   3. Install aarch64-android dependencies via vcpkg:
#        vcpkg install --triplet arm64-android cryptopp curl openssl
#
# Usage:
#   # 1. Substitute the absolute repo path into @SOURCE_ROOT@ (Meson requires
#   #    cmake_toolchain_file to be absolute):
#   sed -i "s|@SOURCE_ROOT@|$(pwd)|g" toolchains/cross-android-arm64.ini
#
#   # 2. Export NDK path + ABI/platform so the CMake wrapper picks them up
#   #    when configuring the libpodofo subproject:
#   export ANDROID_NDK_ROOT=/path/to/android-ndk
#   export ANDROID_ABI=arm64-v8a
#   export ANDROID_PLATFORM=android-28
#
#   # 3. Configure + build:
#   PKG_CONFIG_LIBDIR=/path/to/arm64-android/lib/pkgconfig \
#     meson setup builddir-android --cross-file toolchains/cross-android-arm64.ini
#   meson compile -C builddir-android

[constants]
# --- Set this to your Android NDK installation path ---
ndk_path = '/opt/android-ndk'
api = '28'
toolchain = ndk_path + '/toolchains/llvm/prebuilt/linux-x86_64/bin'

[binaries]
c = toolchain + '/aarch64-linux-android' + api + '-clang'
cpp = toolchain + '/aarch64-linux-android' + api + '-clang++'
ar = toolchain + '/llvm-ar'
strip = toolchain + '/llvm-strip'
ranlib = toolchain + '/llvm-ranlib'
pkg-config = '/usr/bin/pkg-config'
cmake = '/usr/bin/cmake'

[built-in options]
cpp_args = ['-fvisibility=hidden']
c_args = ['-fvisibility=hidden']
cpp_link_args = []
c_link_args = []

[properties]
needs_exe_wrapper = true
# Used by the libpodofo Meson subproject (CMake-based). @SOURCE_ROOT@ is
# substituted with the absolute repo path before `meson setup` runs.
cmake_toolchain_file = '@SOURCE_ROOT@/toolchains/cmake-android-toolchain.cmake'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
