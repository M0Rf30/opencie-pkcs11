# MinGW-w64 cross-compilation file for building on Linux targeting Windows.
#
# Prerequisites:
#   1. Install MinGW-w64 toolchain (e.g. `pacman -S mingw-w64-gcc` on Arch)
#   2. Install vcpkg and set VCPKG_ROOT environment variable
#   3. Install dependencies: vcpkg install --triplet x64-mingw-dynamic \
#        cryptopp curl freetype libpng libxml2 openssl podofo zlib
#
# Usage:
#   export VCPKG_ROOT=$HOME/vcpkg
#   meson setup builddir-win libs --cross-file toolchains/cross-mingw.ini
#   meson compile -C builddir-win

[binaries]
c = '/usr/bin/x86_64-w64-mingw32-gcc'
cpp = '/usr/bin/x86_64-w64-mingw32-g++'
ar = '/usr/bin/x86_64-w64-mingw32-ar'
strip = '/usr/bin/x86_64-w64-mingw32-strip'
windres = '/usr/bin/x86_64-w64-mingw32-windres'
exe_wrapper = 'wine64'
pkg-config = '/usr/bin/pkg-config'

[built-in options]
cpp_args = ['-DNOMINMAX', '-fpermissive']
cpp_link_args = []
c_args = []
c_link_args = []

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
