# Android NDK cross-compilation file for building targeting Android armeabi-v7a.
#
# Prerequisites:
#   1. Install the Android NDK (r26+) — download from https://developer.android.com/ndk
#   2. Set ndk_path below to your NDK installation directory
#   3. Install armv7-android dependencies via vcpkg:
#        vcpkg install --triplet arm-android cryptopp curl openssl
#
# Usage:
#   PKG_CONFIG_LIBDIR=/path/to/arm-android/lib/pkgconfig \
#     meson setup builddir-android-armv7 --cross-file cross-android-armv7.ini
#   meson compile -C builddir-android-armv7

[constants]
ndk_path = '/opt/android-ndk'
api = '24'
toolchain = ndk_path + '/toolchains/llvm/prebuilt/linux-x86_64/bin'

[binaries]
c = toolchain + '/armv7a-linux-androideabi' + api + '-clang'
cpp = toolchain + '/armv7a-linux-androideabi' + api + '-clang++'
ar = toolchain + '/llvm-ar'
strip = toolchain + '/llvm-strip'
ranlib = toolchain + '/llvm-ranlib'
pkg-config = '/usr/bin/pkg-config'

[built-in options]
cpp_args = ['-fvisibility=hidden']
c_args = ['-fvisibility=hidden']
cpp_link_args = []
c_link_args = []

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'android'
cpu_family = 'arm'
cpu = 'armv7a'
endian = 'little'
