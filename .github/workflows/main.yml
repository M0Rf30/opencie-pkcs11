# SPDX-License-Identifier: LGPL-3.0-or-later
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least-privilege default: every job gets read-only contents access unless
# it overrides `permissions` itself (codeql/semgrep need security-events:write
# to upload SARIF; release needs contents:write to publish a GitHub Release).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system tools required by pre-commit hooks
        run: sudo apt-get update && sudo apt-get install -y clang-format-19 cppcheck python3-pip

      - run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pre-commit run --all-files --show-diff-on-failure

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: >
          sudo apt-get update;
          sudo apt-get install -y cmake g++
          libcurl4-openssl-dev libfontconfig1-dev
          libfreetype6-dev libopenjp2-7-dev libpcsclite-dev libpng-dev
          libssl-dev libxml2-dev
          pkg-config python3-pip

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - run: pip install "meson==1.12.0" "ninja==1.13.0"

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: codeql

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build for CodeQL
        run: |
          meson setup builddir-codeql -Dtests=false
          meson compile -C builddir-codeql
        env:
          CC: ccache gcc
          CXX: ccache g++

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:c-cpp

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep
        run: semgrep scan --config p/default --config p/c --sarif --output semgrep.sarif .
        continue-on-error: true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: >
          sudo apt-get update;
          sudo apt-get install -y cmake g++
          libcurl4-openssl-dev libfontconfig1-dev
          libfreetype6-dev libopenjp2-7-dev libpcsclite-dev libpng-dev
          libssl-dev libxml2-dev
          pkg-config python3-pip

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - run: pip install "meson==1.12.0" "ninja==1.13.0"

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: test

      - name: Configure
        run: meson setup builddir-test -Db_sanitize=address,undefined -Db_lundef=false
        env:
          CC: ccache gcc
          CXX: ccache g++

      - name: Test
        run: meson test -C builddir-test --print-errorlogs
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/lsan-suppressions.txt
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: test-meson-log
          path: builddir-test/meson-logs/

  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: >
          sudo apt-get update;
          sudo apt-get install -y cmake g++
          libcurl4-openssl-dev libfontconfig1-dev
          libfreetype6-dev libopenjp2-7-dev libpcsclite-dev libpng-dev
          libssl-dev libxml2-dev
          pkg-config python3-pip

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - run: pip install "meson==1.12.0" "ninja==1.13.0"

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: tsan

      # ThreadSanitizer catches data races between the background PC/SC
      # reader-monitor thread and the C_* entry points serialized by
      # p11Mutex (see AGENTS.md "Thread Safety"). ASan/UBSan (the `test`
      # job) do not catch this class of bug.
      - name: Configure
        run: meson setup builddir-tsan -Db_sanitize=thread -Db_lundef=false
        env:
          CC: ccache gcc
          CXX: ccache g++

      - name: Test
        run: meson test -C builddir-tsan --print-errorlogs
        env:
          TSAN_OPTIONS: halt_on_error=1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: tsan-meson-log
          path: builddir-tsan/meson-logs/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: >
          sudo apt-get update;
          sudo apt-get install -y clang clang-tools cmake g++
          libcurl4-openssl-dev libfontconfig1-dev
          libfreetype6-dev libopenjp2-7-dev libpcsclite-dev libpng-dev
          libssl-dev libxml2-dev
          pkg-config python3-pip

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - run: pip install "meson==1.12.0" "ninja==1.13.0"

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux

      - name: Build static libxml2 without ICU for the portable release artifact
        # This job's output (linux-x86_64) is the artifact shipped in
        # releases and documented as "portable" (README.md). Debian/Ubuntu
        # link their packaged libxml2 against ICU since 24.04 "noble", so
        # picking up apt's libxml2-dev here would leave dynamic
        # libicuuc/libicui18n/libicudata NEEDED entries in the shipped .so
        # that are absent on older/other distros (GH issue #25). Build our
        # own static, ICU-free libxml2 up front (outside $GITHUB_WORKSPACE,
        # so Meson's cmake.subproject() import does not drop its includes
        # as "inside the root project but not inside the subproject") and
        # LIBXML2_STATIC_PREFIX (read by meson.build) so both this
        # project's own libxml2 use and PoDoFo's cmake find_package(LibXml2)
        # resolve to it instead.
        run: |
          set -eux
          XML2_VER=2.15.4
          XML2_PREFIX="${RUNNER_TEMP}/vendor/libxml2-static"
          curl -fsSL -o /tmp/libxml2.tar.xz \
            "https://download.gnome.org/sources/libxml2/${XML2_VER%.*}/libxml2-${XML2_VER}.tar.xz"
          echo "98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821  /tmp/libxml2.tar.xz" | sha256sum -c -
          tar -C /tmp -xf /tmp/libxml2.tar.xz
          meson setup /tmp/libxml2-build "/tmp/libxml2-${XML2_VER}" \
            --prefix="${XML2_PREFIX}" --libdir=lib --buildtype=release \
            -Ddefault_library=static -Dicu=disabled -Dpython=disabled \
            -Dhttp=disabled -Dreadline=disabled -Dhistory=disabled -Ddocs=disabled
          meson install -C /tmp/libxml2-build
          echo "LIBXML2_STATIC_PREFIX=${XML2_PREFIX}" >> "$GITHUB_ENV"
        env:
          CC: ccache gcc
          CXX: ccache g++

      - name: Configure
        run: meson setup builddir -Dtests=false -Dportable=true
        env:
          CC: ccache gcc
          CXX: ccache g++

      - name: Build
        run: meson compile -C builddir

      - name: Strip
        run: strip builddir/libopencie-pkcs11.so

      - name: Verify portable artifact has no dynamic libxml2/ICU dependency
        run: |
          set -eux
          readelf -d builddir/libopencie-pkcs11.so | tee needed.txt
          ! grep -Ei 'libxml2|libicu' needed.txt

      - name: Scan-build (Clang Static Analyzer)
        run: |
          meson setup builddir-scan -Dtests=false --wipe 2>/dev/null || meson setup builddir-scan -Dtests=false
          mkdir -p scan-results
          scan-build --status-bugs -o scan-results meson compile -C builddir-scan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: scan-build-results
          path: scan-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-x86_64
          path: |
            builddir/libopencie-pkcs11.so
            builddir/libopencie-sign-sdk.a

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: linux-meson-log
          path: builddir/meson-logs/meson-log.txt

  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Add arm64 architecture and install cross-dependencies
        run: |
          sudo dpkg --add-architecture arm64
          # Ubuntu 24.04 (Noble) runners use DEB822 format and security.ubuntu.com
          # does not serve arm64 packages. Restrict existing sources to amd64 and
          # add ports.ubuntu.com for arm64.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Types:/Architectures: amd64\nTypes:/' /etc/apt/sources.list.d/ubuntu.sources
          else
            sudo sed -i 's|^deb |deb [arch=amd64] |' /etc/apt/sources.list
          fi
          printf '%s\n' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse' \
            | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++-aarch64-linux-gnu \
            libcurl4-openssl-dev:arm64 \
            libfontconfig1-dev:arm64 \
            libfreetype6-dev:arm64 \
            libopenjp2-7-dev:arm64 \
            libpcsclite-dev:arm64 \
            libpng-dev:arm64 \
            libssl-dev:arm64 \
            libxml2-dev:arm64 \
            pkg-config python3-pip zlib1g-dev:arm64

      - name: Install qemu-user-static (to run the aarch64 test suite under emulation)
        run: sudo apt-get install -y qemu-user-static

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - run: pip install "meson==1.12.0" "ninja==1.13.0"

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux-arm64

      - name: Configure cross file
        run: sed -i "s|@SOURCE_ROOT@|${GITHUB_WORKSPACE}|g" toolchains/cross-aarch64.ini

      - name: Configure
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig
          CC: ccache aarch64-linux-gnu-gcc
          CXX: ccache aarch64-linux-gnu-g++
        run: meson setup builddir-arm64 --cross-file toolchains/cross-aarch64.ini

      - name: Build
        run: meson compile -C builddir-arm64

      - name: Test (aarch64, under qemu-user emulation)
        run: meson test -C builddir-arm64 --print-errorlogs

      - name: Strip
        run: aarch64-linux-gnu-strip builddir-arm64/libopencie-pkcs11.so

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-aarch64
          path: builddir-arm64/libopencie-pkcs11.so

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: linux-arm64-meson-log
          path: builddir-arm64/meson-logs/meson-log.txt

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Clang and MinGW toolchain
        # Tests are compiled (not executed) for Windows: the cross build has
        # no Windows runtime here, and running the .exe under Wine needs the
        # clang-mingw C++ runtime DLLs, which this runner doesn't provide.
        run: >
          sudo apt-get update;
          sudo apt-get install -y cmake clang lld mingw-w64
          pkg-config python3-pip

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - run: pip install "meson==1.12.0" "ninja==1.13.0"

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: windows

      - name: Install vcpkg
        uses: johnwason/vcpkg-action@04c68c847bf5196ecaa72331ecf51208583916ef # v8
        with:
          pkgs: >-
            curl
            freetype
            liblzma
            libpng
            libxml2
            openjpeg
            openssl
            zlib
          triplet: x64-mingw-dynamic
          cache-key: windows
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Relocate vcpkg installed tree outside the workspace
        # Meson's cmake.subproject() drops -I flags whose path resolves
        # inside $GITHUB_WORKSPACE but outside the (podofo) subproject dir
        # ("path ... is inside the root project but not inside the
        # subproject. --> Ignoring."), which silently breaks the PoDoFo
        # cmake build's access to vcpkg's libxml2/freetype/etc. headers.
        # Copy the installed tree to $RUNNER_TEMP (always outside the
        # workspace) and point every subsequent step at that copy instead.
        run: |
          mkdir -p "${RUNNER_TEMP}/vcpkg-installed"
          cp -a vcpkg/installed/. "${RUNNER_TEMP}/vcpkg-installed/"

      - name: Configure
        env:
          PKG_CONFIG_LIBDIR: ${{ runner.temp }}/vcpkg-installed/x64-mingw-dynamic/lib/pkgconfig
          CC: ccache clang
          CXX: ccache clang++
        run: meson setup builddir-clang-win --cross-file toolchains/cross-clang-mingw.ini

      - name: Build
        env:
          PKG_CONFIG_LIBDIR: ${{ runner.temp }}/vcpkg-installed/x64-mingw-dynamic/lib/pkgconfig
        run: meson compile -C builddir-clang-win

      - name: Strip
        run: x86_64-w64-mingw32-strip builddir-clang-win/libopencie-pkcs11.dll

      - name: Collect runtime DLL bundle
        run: |
          mkdir -p dist-win/runtime
          cp builddir-clang-win/libopencie-pkcs11.dll dist-win/
          # vcpkg runtime DLLs (direct + transitive deps)
          cp "${RUNNER_TEMP}/vcpkg-installed/x64-mingw-dynamic/bin/"*.dll dist-win/runtime/
          # MinGW runtime DLLs
          cp /usr/x86_64-w64-mingw32/bin/libgcc_s_seh-1.dll \
             /usr/x86_64-w64-mingw32/bin/libstdc++-6.dll \
             /usr/x86_64-w64-mingw32/bin/libwinpthread-1.dll \
             dist-win/runtime/ || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-x86_64
          path: dist-win/libopencie-pkcs11.dll

      - name: Upload runtime DLL bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-x86_64-runtime-deps
          path: dist-win/runtime/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: windows-meson-log
          path: builddir-clang-win/meson-logs/meson-log.txt

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: >
          brew install --quiet curl fontconfig freetype
          libpng libxml2 openjpeg openssl

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - run: pip install "meson==1.12.0" "ninja==1.13.0"

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: macos

      - name: Configure
        run: >
          PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig"
          CC="ccache clang" CXX="ccache clang++"
          meson setup builddir-macos

      - name: Build
        run: meson compile -C builddir-macos

      - name: Test (native arm64)
        run: meson test -C builddir-macos --print-errorlogs

      - name: Strip
        run: strip -x builddir-macos/libopencie-pkcs11.dylib

      - name: Verify exported symbols
        run: |
          echo '=== Exported symbols ==='
          SYMBOLS=$(nm -gU builddir-macos/libopencie-pkcs11.dylib | grep -c ' _C_\|_cie_enable\|_cie_change_pin\|_cie_disable\|_cie_unblock_pin\|_cie_is_enabled\|_cie_extract_p7m\|_cie_sign\|_cie_get_sign_count\|_cie_get_verify_info\|_make_digest_info\|_cie_verify')
          echo "Public API symbols: $SYMBOLS"
          echo ''
          echo '=== All exported symbols ==='
          nm -gU builddir-macos/libopencie-pkcs11.dylib | grep ' T '

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-arm64
          path: builddir-macos/libopencie-pkcs11.dylib

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: macos-meson-log
          path: builddir-macos/meson-logs/meson-log.txt

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - run: pip install "meson==1.12.0" "ninja==1.13.0"

      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Set up Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Install vcpkg
        uses: johnwason/vcpkg-action@04c68c847bf5196ecaa72331ecf51208583916ef # v8
        with:
          pkgs: >-
            curl
            freetype
            libpng
            libxml2
            openjpeg
            openssl
            zlib
          triplet: arm64-android
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Relocate vcpkg installed tree outside the workspace
        # See the "windows" job for why: Meson's cmake.subproject() import
        # ignores -I flags whose path is inside $GITHUB_WORKSPACE but
        # outside the PoDoFo subproject dir.
        run: |
          mkdir -p "${RUNNER_TEMP}/vcpkg-installed"
          cp -a vcpkg/installed/. "${RUNNER_TEMP}/vcpkg-installed/"
      - name: Configure cross file
        run: |
          sed -i "s|/opt/android-ndk|${{ steps.setup-ndk.outputs.ndk-path }}|g" toolchains/cross-android-arm64.ini
          sed -i "s|@SOURCE_ROOT@|${GITHUB_WORKSPACE}|g" toolchains/cross-android-arm64.ini

      - name: Configure
        env:
          PKG_CONFIG_LIBDIR: ${{ runner.temp }}/vcpkg-installed/arm64-android/lib/pkgconfig
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_ABI: arm64-v8a
          ANDROID_PLATFORM: android-28
          VCPKG_INSTALLED_DIR: ${{ runner.temp }}/vcpkg-installed
          VCPKG_TARGET_TRIPLET: arm64-android
        run: meson setup builddir-android --cross-file toolchains/cross-android-arm64.ini -Dtests=false

      - name: Build
        env:
          PKG_CONFIG_LIBDIR: ${{ runner.temp }}/vcpkg-installed/arm64-android/lib/pkgconfig
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_ABI: arm64-v8a
          ANDROID_PLATFORM: android-28
          VCPKG_INSTALLED_DIR: ${{ runner.temp }}/vcpkg-installed
          VCPKG_TARGET_TRIPLET: arm64-android
        run: meson compile -C builddir-android

      - name: Strip
        run: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip builddir-android/libopencie-pkcs11.so

      - name: Verify binary
        run: |
          echo '=== File type ==='
          file builddir-android/libopencie-pkcs11.so
          echo ''
          echo '=== Exported symbols ==='
          NM="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          $NM -D builddir-android/libopencie-pkcs11.so | grep ' T ' | head -20
          echo ''
          echo '=== JNI bridge symbols (both app package names, OC-02) ==='
          $NM -D builddir-android/libopencie-pkcs11.so | grep '_CieNfcBridge_' || true
          for sym in \
            Java_io_github_m0rf30_opencie_CieNfcBridge_nativeSetNfcTag \
            Java_io_github_m0rf30_opencie_CieNfcBridge_nativeClearNfcTag \
            Java_io_github_m0rf30_opencie_CieNfcBridge_nativeSetDataDir \
            Java_it_m0rf30_opencie_CieNfcBridge_nativeSetNfcTag \
            Java_it_m0rf30_opencie_CieNfcBridge_nativeClearNfcTag \
            Java_it_m0rf30_opencie_CieNfcBridge_nativeSetDataDir; do
            $NM -D builddir-android/libopencie-pkcs11.so | grep -q " T ${sym}\$" || {
              echo "::error::Missing exported JNI symbol: ${sym}"
              exit 1
            }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-arm64
          path: builddir-android/libopencie-pkcs11.so

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: android-meson-log
          path: builddir-android/meson-logs/meson-log.txt

  android-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - run: pip install "meson==1.12.0" "ninja==1.13.0"

      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Set up Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Install vcpkg
        uses: johnwason/vcpkg-action@04c68c847bf5196ecaa72331ecf51208583916ef # v8
        with:
          pkgs: >-
            curl
            freetype
            libpng
            libxml2
            openjpeg
            openssl
            zlib
          triplet: x64-android
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Relocate vcpkg installed tree outside the workspace
        run: |
          mkdir -p "${RUNNER_TEMP}/vcpkg-installed"
          cp -a vcpkg/installed/. "${RUNNER_TEMP}/vcpkg-installed/"
      - name: Configure cross file
        run: |
          sed -i "s|/opt/android-ndk|${{ steps.setup-ndk.outputs.ndk-path }}|g" toolchains/cross-android-x86_64.ini
          sed -i "s|@SOURCE_ROOT@|${GITHUB_WORKSPACE}|g" toolchains/cross-android-x86_64.ini

      - name: Configure
        env:
          PKG_CONFIG_LIBDIR: ${{ runner.temp }}/vcpkg-installed/x64-android/lib/pkgconfig
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_ABI: x86_64
          ANDROID_PLATFORM: android-28
          VCPKG_INSTALLED_DIR: ${{ runner.temp }}/vcpkg-installed
          VCPKG_TARGET_TRIPLET: x64-android
        run: meson setup builddir-android-x86_64 --cross-file toolchains/cross-android-x86_64.ini -Dtests=false

      - name: Build
        env:
          PKG_CONFIG_LIBDIR: ${{ runner.temp }}/vcpkg-installed/x64-android/lib/pkgconfig
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_ABI: x86_64
          ANDROID_PLATFORM: android-28
          VCPKG_INSTALLED_DIR: ${{ runner.temp }}/vcpkg-installed
          VCPKG_TARGET_TRIPLET: x64-android
        run: meson compile -C builddir-android-x86_64

      - name: Strip
        run: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip builddir-android-x86_64/libopencie-pkcs11.so

      - name: Verify binary
        run: |
          echo '=== File type ==='
          file builddir-android-x86_64/libopencie-pkcs11.so
          echo ''
          echo '=== Exported symbols ==='
          NM="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          $NM -D builddir-android-x86_64/libopencie-pkcs11.so | grep ' T ' | head -20
          echo ''
          echo '=== JNI bridge symbols (both app package names, OC-02) ==='
          $NM -D builddir-android-x86_64/libopencie-pkcs11.so | grep '_CieNfcBridge_' || true
          for sym in \
            Java_io_github_m0rf30_opencie_CieNfcBridge_nativeSetNfcTag \
            Java_io_github_m0rf30_opencie_CieNfcBridge_nativeClearNfcTag \
            Java_io_github_m0rf30_opencie_CieNfcBridge_nativeSetDataDir \
            Java_it_m0rf30_opencie_CieNfcBridge_nativeSetNfcTag \
            Java_it_m0rf30_opencie_CieNfcBridge_nativeClearNfcTag \
            Java_it_m0rf30_opencie_CieNfcBridge_nativeSetDataDir; do
            $NM -D builddir-android-x86_64/libopencie-pkcs11.so | grep -q " T ${sym}\$" || {
              echo "::error::Missing exported JNI symbol: ${sym}"
              exit 1
            }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-x86_64
          path: builddir-android-x86_64/libopencie-pkcs11.so

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: android-x86_64-meson-log
          path: builddir-android-x86_64/meson-logs/meson-log.txt

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs:
      [lint, test, linux, linux-arm64, windows, macos, android, android-x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download linux-x86_64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: linux-x86_64
          path: dist/linux-x86_64

      - name: Download linux-aarch64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: linux-aarch64
          path: dist/linux-aarch64

      - name: Download windows-x86_64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-x86_64
          path: dist/windows-x86_64

      - name: Download windows-x86_64-runtime-deps
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-x86_64-runtime-deps
          path: dist/windows-x86_64-runtime-deps

      - name: Download macos-arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-arm64
          path: dist/macos-arm64

      - name: Download android-arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-arm64
          path: dist/android-arm64

      - name: Download android-x86_64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-x86_64
          path: dist/android-x86_64

      - name: Stage release assets
        run: |
          TAG=${GITHUB_REF_NAME}
          mkdir -p release
          cp dist/linux-x86_64/libopencie-pkcs11.so        "release/libopencie-pkcs11-${TAG}-linux-x86_64.so"
          cp dist/linux-x86_64/libopencie-sign-sdk.a       "release/libopencie-sign-sdk-${TAG}-linux-x86_64.a"
          cp dist/linux-aarch64/libopencie-pkcs11.so       "release/libopencie-pkcs11-${TAG}-linux-aarch64.so"
          cp dist/windows-x86_64/libopencie-pkcs11.dll     "release/libopencie-pkcs11-${TAG}-windows-x86_64.dll"
          ( cd dist/windows-x86_64-runtime-deps && zip -r "../../release/windows-x86_64-runtime-deps-${TAG}.zip" . )
          cp dist/macos-arm64/libopencie-pkcs11.dylib      "release/libopencie-pkcs11-${TAG}-macos-arm64.dylib"
          cp dist/android-arm64/libopencie-pkcs11.so       "release/libopencie-pkcs11-${TAG}-android-arm64.so"
          cp dist/android-x86_64/libopencie-pkcs11.so      "release/libopencie-pkcs11-${TAG}-android-x86_64.so"
          ls -lh release/

      # Syft scans the checkout (source plus the staged release binaries),
      # then scripts/sbom-add-wraps.py adds the Meson wrap pins Syft cannot
      # see, drops CI-only and bare file entries, and names the release.
      # Written into release/ before the checksums so SHA256SUMS covers it
      # and it is attested below.
      - name: Scan source with Syft (CycloneDX)
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/syft.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM
        run: |
          TAG=${GITHUB_REF_NAME}
          python3 scripts/sbom-add-wraps.py \
            "${RUNNER_TEMP}/syft.cdx.json" "${TAG}" \
            "release/libopencie-pkcs11-${TAG}.cdx.json"

      - name: Generate checksums
        run: |
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # SLSA build provenance for every release asset, SBOM and SHA256SUMS
      # included. Verify a download with:
      #   gh attestation verify <file> --repo M0Rf30/opencie-pkcs11
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF_NAME}
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            release/*

      - name: Trigger jniLibs sync in opencie
        env:
          GH_TOKEN: ${{ secrets.OPENCIE_SYNC_TOKEN }}
        run: |
          TAG=${GITHUB_REF_NAME}
          gh api repos/M0Rf30/opencie/dispatches \
            --method POST \
            --field event_type=opencie-pkcs11-released \
            --field client_payload[tag]="${TAG}" \
          || echo "Warning: could not trigger opencie sync (token may not be set)"
